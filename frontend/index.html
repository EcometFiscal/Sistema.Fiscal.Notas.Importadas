<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lastro — Estoque e Apuração de Importados</title>
    <script>
      // Define o tema antes do React montar, pra nao piscar claro->escuro na carga.
      (function () {
        try {
          var salvo = localStorage.getItem('lastro_tema')
          var tema = salvo || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', tema)
        } catch (e) { /* localStorage indisponivel - fica no claro */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
